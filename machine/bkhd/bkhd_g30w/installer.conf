description="BKHD g30w (Intel J6412, 4x I226)"

# Auto-selection never falls back to SATA. Explicit -d targets and
# embed/update policy are handled by the common installer, as on AS7326.
# Multiple namespaces require installer -d.
install_device_platform()
{
    local devices
    devices=$(g30w_nvme_candidates)
    set -- $devices
    [ "$#" -eq 1 ] || {
        echo "ERROR: Expected one NVMe namespace; select explicitly with -d." >&2
        return 1
    }
    echo "$1"
}

g30w_nvme_candidates()
{
    local entry name
    # Enumerate whole disks. Some ONIE kernels expose these under
    # /sys/block without a corresponding /sys/class/block entry.
    for entry in /sys/block/nvme*n* ; do
        [ -e "$entry" ] || continue
        [ ! -e "$entry/partition" ] || continue
        name=${entry##*/}
        echo "$name" | grep -Eq '^nvme[0-9]+n[0-9]+$' || continue
        [ -b "/dev/$name" ] && echo "/dev/$name"
    done
}
